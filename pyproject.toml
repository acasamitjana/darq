[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darq"
version = "0.1.0"
description = "Automatic quantification pipeline of DaTSCAN images"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Adrià Casamitjana" }
]
dependencies = [
    "nibabel",
    "numpy",
    "pandas",
    "torch",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "tqdm",
    "joblib",
    "gradio",
    "matplotlib",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "flake8",
    "sphinx",
    "sphinx-rtd-theme"
]

[project.scripts]
darq = "scripts.darq_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["darq*", "scripts*", "webapp*"]

[tool.setuptools]
include-package-data = true
py-modules = ["app_darq"]

[tool.setuptools.package-data]
darq = ["data/labels_classes_priors/*.npy"]
"darq.data.labels_classes_priors" = ["*.npy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: tests lents o de integració",
    "gpu: tests que necessiten CUDA",
]