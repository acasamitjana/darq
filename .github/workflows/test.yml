name: CI Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          find darq tests -name "*.py" -print0 \
            | xargs -0 python -m py_compile
          echo "All Python files parsed successfully."

  tests:
    name: Run pytest
    runs-on: ubuntu-latest
    needs: syntax

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install nibabel numpy pandas torch scikit-image scikit-learn scipy tqdm joblib

      - name: Run tests with coverage
        run: |
          pytest  tests/ --cov=darq --cov-branch --cov-report=xml
          
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
